<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>姿勢検出デモ - Pose Detection Demo</title>
    
    <!-- キャッシュ制御: HTMLの更新を確実に反映 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #container {
            position: relative;
            max-width: 100vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* ミラー表示 */
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* ミラー表示 */
        }
        
        #controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status {
            color: white;
            font-size: 14px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            text-align: center;
            max-width: 90vw;
        }
        
        #fps {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
        
        #version {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            z-index: 10;
        }
        
        #debug-info {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10;
            max-width: 400px;
            display: none;
        }
        
        #cache-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #4CAF50;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            z-index: 10;
            display: none;
        }
        
        #cache-status.cached {
            color: #4CAF50;
        }
        
        #cache-status.downloading {
            color: #FFC107;
        }
        
        .loading {
            color: white;
            font-size: 18px;
            text-align: center;
        }
        
        .error {
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 90vw;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .error h3 {
            margin: 0 0 10px 0;
            color: #e74c3c;
        }
        
        .error-details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            overflow-wrap: break-word;
        }
        
        .error-actions {
            margin-top: 15px;
            text-align: center;
        }
        
        #retryBtn {
            background: #3498db;
            color: white;
            margin-top: 10px;
        }
        
        #retryBtn:hover {
            background: #2980b9;
        }
        
        /* プログレスバー */
        #progress-container {
            width: 100%;
            max-width: 500px;
            margin: 10px 0;
            display: none;
        }
        
        #progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        #progress-text {
            color: white;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }
        
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status" class="loading pulse">モデルを読み込み中...</div>
        
        <!-- プログレスバー -->
        <div id="progress-container">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-text">初期化中...</div>
        </div>
        
        <div id="video-container" style="display: none;">
            <div id="fps">0 FPS</div>
            <div id="cache-status" class="downloading">📦 ダウンロード中...</div>
            <div id="version">v1.0.0</div>
            <div id="debug-info">デバッグ情報</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="controls">
            <button id="startBtn" disabled>カメラを起動</button>
            <button id="switchBtn" style="display: none;">カメラ切替</button>
            <button id="modelSwitchBtn" style="display: none;">体検出 ⇄ 顔検出</button>
        </div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <!-- Pose Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0"></script>
    <!-- Face Landmarks Detection (Face Mesh) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.2"></script>
    
    <!-- アプリバージョン管理 -->
    <script>
        // バージョン番号（更新時にインクリメント）
        const APP_VERSION = '1.2.1-debug';
        const BUILD_DATE = '2025-11-12 (顔検出デバッグ強化版)';
    </script>
    
    <!-- Service Worker の登録 -->
    <script>
        // Service Worker をサポートしているか確認
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker が登録されました:', registration.scope);
                        
                        // キャッシュステータスを確認
                        checkCacheStatus();
                    })
                    .catch((error) => {
                        console.log('❌ Service Worker の登録に失敗:', error);
                    });
            });
        } else {
            console.log('⚠️ このブラウザは Service Worker をサポートしていません');
        }
        
        // キャッシュステータスを確認
        async function checkCacheStatus() {
            if (!navigator.serviceWorker.controller) {
                return;
            }
            
            const messageChannel = new MessageChannel();
            messageChannel.port1.onmessage = (event) => {
                if (event.data.type === 'CACHE_STATUS') {
                    const cacheStatusEl = document.getElementById('cache-status');
                    if (cacheStatusEl) {
                        if (event.data.cached) {
                            cacheStatusEl.textContent = `💾 キャッシュ済み (${event.data.fileCount}ファイル)`;
                            cacheStatusEl.className = 'cached';
                        } else {
                            cacheStatusEl.textContent = '📦 初回ダウンロード';
                            cacheStatusEl.className = 'downloading';
                        }
                        cacheStatusEl.style.display = 'block';
                    }
                }
            };
            
            navigator.serviceWorker.controller.postMessage(
                { type: 'GET_CACHE_STATUS' },
                [messageChannel.port2]
            );
        }
        
        // キャッシュをクリアする関数（デバッグ用）
        async function clearModelCache() {
            if (!navigator.serviceWorker.controller) {
                console.log('Service Worker が動作していません');
                return;
            }
            
            const messageChannel = new MessageChannel();
            messageChannel.port1.onmessage = (event) => {
                if (event.data.type === 'CACHE_CLEARED') {
                    console.log('✅ キャッシュをクリアしました');
                    location.reload();
                }
            };
            
            navigator.serviceWorker.controller.postMessage(
                { type: 'CLEAR_CACHE' },
                [messageChannel.port2]
            );
        }
        
        // グローバルに公開（デバッグ用）
        window.clearModelCache = clearModelCache;
    </script>

    <script>
        let video, canvas, ctx;
        let poseDetector;
        let faceDetector;
        let currentDetector;
        let detectionMode = 'pose'; // 'pose' または 'face'
        let animationId;
        let currentFacingMode = 'user'; // 'user' = フロントカメラ, 'environment' = バックカメラ
        let stream;
        
        // FPS計測用
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        
        // UI要素
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const modelSwitchBtn = document.getElementById('modelSwitchBtn');
        const videoContainer = document.getElementById('video-container');
        const fpsDisplay = document.getElementById('fps');
        const versionDisplay = document.getElementById('version');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const debugInfo = document.getElementById('debug-info');
        
        // バージョン表示を更新
        if (versionDisplay) {
            versionDisplay.textContent = `v${APP_VERSION} (${BUILD_DATE})`;
        }
        
        // プログレスバーを更新
        function updateProgress(percent, message) {
            progressContainer.style.display = 'block';
            progressFill.style.width = percent + '%';
            progressText.textContent = message;
        }
        
        // 詳細なエラーを表示
        function showDetailedError(errorMessage, details) {
            statusDiv.className = 'error';
            statusDiv.innerHTML = `
                <h3>❌ エラーが発生しました</h3>
                <p><strong>エラー内容:</strong> ${errorMessage}</p>
                <div class="error-details">
                    ${details}
                </div>
                <div class="error-actions">
                    <button id="retryBtn">🔄 再試行</button>
                </div>
            `;
            
            progressContainer.style.display = 'none';
            
            // 再試行ボタンのイベントリスナー
            document.getElementById('retryBtn').addEventListener('click', () => {
                location.reload();
            });
        }
        
        // タイムアウト付きPromise
        function withTimeout(promise, timeoutMs, timeoutMessage) {
            return Promise.race([
                promise,
                new Promise((_, reject) => 
                    setTimeout(() => reject(new Error(timeoutMessage)), timeoutMs)
                )
            ]);
        }
        
        // 初期化
        async function init() {
            const startTime = Date.now();
            
            try {
                video = document.getElementById('video');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                
                // ステップ1: TensorFlow.jsの読み込み確認
                statusDiv.textContent = 'TensorFlow.jsを初期化中...';
                updateProgress(10, 'TensorFlow.jsを読み込んでいます...');
                
                if (typeof tf === 'undefined') {
                    throw new Error('TensorFlow.jsが読み込まれていません。インターネット接続を確認してください。');
                }
                
                // ステップ2: バックエンドの初期化（重要！）
                updateProgress(20, 'バックエンドを初期化中...');
                statusDiv.textContent = 'バックエンドを初期化中...';
                
                try {
                    // タイムアウト60秒でバックエンドを初期化
                    await withTimeout(
                        tf.ready(),
                        60000,
                        'バックエンドの初期化がタイムアウトしました（60秒）。通信速度が遅い可能性があります。'
                    );
                } catch (error) {
                    throw new Error('バックエンドの初期化に失敗: ' + error.message);
                }
                
                // バックエンド情報を取得
                const backend = tf.getBackend();
                console.log('使用中のバックエンド:', backend);
                
                updateProgress(40, `バックエンド "${backend}" を初期化しました`);
                
                // ステップ3: Pose Detectionライブラリの確認
                updateProgress(40, 'Pose Detectionライブラリを確認中...');
                
                if (typeof poseDetection === 'undefined') {
                    throw new Error('Pose Detectionライブラリが読み込まれていません。インターネット接続を確認してください。');
                }
                
                if (typeof faceLandmarksDetection === 'undefined') {
                    throw new Error('Face Landmarks Detectionライブラリが読み込まれていません。インターネット接続を確認してください。');
                }
                
                // ステップ4: 体検出モデルの読み込み
                statusDiv.textContent = 'MoveNet（体検出）モデルを読み込み中...';
                updateProgress(50, 'MoveNetモデルをダウンロード中...');
                
                try {
                    // タイムアウト120秒でモデルをロード（通信が遅い環境用）
                    poseDetector = await withTimeout(
                        poseDetection.createDetector(
                            poseDetection.SupportedModels.MoveNet,
                            {
                                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                            }
                        ),
                        120000,
                        'MoveNetモデルのダウンロードがタイムアウトしました（120秒）。通信速度が非常に遅い可能性があります。再試行するか、より高速なネットワークに接続してください。'
                    );
                } catch (error) {
                    throw new Error('体検出モデルの読み込みに失敗: ' + error.message);
                }
                
                updateProgress(70, '体検出モデル読み込み完了');
                
                // ステップ5: 顔メッシュモデルの読み込み
                statusDiv.textContent = 'MediaPipe FaceMesh（顔ランドマーク検出）モデルを読み込み中...';
                updateProgress(75, '顔メッシュモデルをダウンロード中...');
                
                try {
                    faceDetector = await withTimeout(
                        faceLandmarksDetection.createDetector(
                            faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
                            {
                                runtime: 'tfjs',
                                refineLandmarks: true,
                                maxFaces: 1
                            }
                        ),
                        120000,
                        '顔メッシュモデルのダウンロードがタイムアウトしました（120秒）。'
                    );
                } catch (error) {
                    throw new Error('顔メッシュモデルの読み込みに失敗: ' + error.message);
                }
                
                updateProgress(90, '顔メッシュモデル読み込み完了');
                
                // デフォルトは体検出
                currentDetector = poseDetector;
                
                // ステップ6: 完了
                const loadTime = ((Date.now() - startTime) / 1000).toFixed(1);
                updateProgress(100, `読み込み完了！（${loadTime}秒）`);
                
                // キャッシュステータスを更新
                setTimeout(checkCacheStatus, 1000);
                
                setTimeout(() => {
                    statusDiv.className = 'loading';
                    statusDiv.textContent = '✅ モデルの読み込み完了！カメラを起動してください（体検出モード）';
                    progressContainer.style.display = 'none';
                    startBtn.disabled = false;
                    modelSwitchBtn.style.display = 'inline-block';
                }, 1000);
                
            } catch (error) {
                console.error('初期化エラー:', error);
                
                // 詳細なエラー情報を収集
                const loadTime = ((Date.now() - startTime) / 1000).toFixed(1);
                let backend = 'unknown';
                try {
                    backend = tf ? tf.getBackend() : 'TensorFlow.js未読み込み';
                } catch (e) {
                    backend = 'エラー';
                }
                
                const errorDetails = `
                    <strong>バックエンド:</strong> ${backend}<br>
                    <strong>読み込み時間:</strong> ${loadTime}秒<br>
                    <strong>ブラウザ:</strong> ${navigator.userAgent}<br>
                    <strong>オンライン状態:</strong> ${navigator.onLine ? 'オンライン' : 'オフライン'}<br>
                    <br>
                    <strong>技術的な詳細:</strong><br>
                    ${error.stack ? error.stack.substring(0, 500) : error.message}
                    <br><br>
                    <strong>💡 対処方法:</strong><br>
                    • より高速なネットワークに接続してください<br>
                    • ページをリロードして再試行してください<br>
                    • ブラウザのキャッシュをクリアしてください<br>
                    • 他のタブやアプリを閉じてメモリを解放してください<br>
                    • 別のブラウザで試してください（Chrome推奨）
                `;
                
                showDetailedError(error.message, errorDetails);
            }
        }
        
        // カメラ起動
        async function startCamera() {
            try {
                // 既存のストリームを停止
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                statusDiv.textContent = 'カメラを起動中...';
                
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    // キャンバスのサイズを動画に合わせる
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    videoContainer.style.display = 'block';
                    statusDiv.style.display = 'none';
                    switchBtn.style.display = 'inline-block';
                    startBtn.textContent = 'カメラを停止';
                    
                    // 検出開始
                    detectPose();
                };
                
            } catch (error) {
                console.error('カメラエラー:', error);
                statusDiv.className = 'error';
                statusDiv.textContent = 'カメラの起動に失敗しました: ' + error.message;
            }
        }
        
        // カメラ停止
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            videoContainer.style.display = 'none';
            statusDiv.style.display = 'block';
            statusDiv.className = '';
            statusDiv.textContent = 'カメラを起動してください';
            switchBtn.style.display = 'none';
            startBtn.textContent = 'カメラを起動';
        }
        
        // カメラ切替
        async function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            await startCamera();
        }
        
        // モデル切替
        function switchDetectionMode() {
            if (detectionMode === 'pose') {
                detectionMode = 'face';
                currentDetector = faceDetector;
                modelSwitchBtn.textContent = '顔検出 ⇄ 体検出';
                statusDiv.textContent = '顔検出モード';
            } else {
                detectionMode = 'pose';
                currentDetector = poseDetector;
                modelSwitchBtn.textContent = '体検出 ⇄ 顔検出';
                statusDiv.textContent = '体検出モード';
            }
            
            // カメラが起動している場合は表示を非表示に
            if (stream) {
                statusDiv.style.display = 'block';
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 2000);
            }
        }
        
        // 検出処理（姿勢または顔）
        async function detectPose() {
            if (!video || video.readyState < 2) {
                animationId = requestAnimationFrame(detectPose);
                return;
            }
            
            try {
                // キャンバスをクリア
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 現在のモードに応じて検出
                if (detectionMode === 'pose') {
                    // 体検出
                    debugInfo.style.display = 'none'; // デバッグ情報を非表示
                    const poses = await currentDetector.estimatePoses(video);
                    if (poses && poses.length > 0) {
                        drawPose(poses[0]);
                    }
                } else {
                    // 顔検出
                    const faces = await currentDetector.estimateFaces(video);
                    
                    // デバッグ情報を画面に表示
                    if (faces && faces.length > 0) {
                        const face = faces[0];
                        debugInfo.style.display = 'block';
                        debugInfo.innerHTML = `
                            ✅ 顔検出: ${faces.length}個<br>
                            キーポイント: ${face.keypoints ? face.keypoints.length : 0}個<br>
                            box: ${face.box ? 'あり' : 'なし'}<br>
                            boundingBox: ${face.boundingBox ? 'あり' : 'なし'}<br>
                            プロパティ: ${Object.keys(face).join(', ')}
                        `;
                        
                        // コンソールにも詳細を出力（30フレームごと）
                        if (frameCount % 30 === 0) {
                            console.log('✅ 顔検出:', faces.length, '個の顔');
                            console.log('顔データ構造:', face);
                            if (face.keypoints && face.keypoints.length > 0) {
                                console.log('キーポイント数:', face.keypoints.length);
                                console.log('最初のキーポイント:', face.keypoints[0]);
                            }
                        }
                        
                        faces.forEach(face => drawFace(face));
                    } else {
                        // 顔が検出されない場合
                        debugInfo.style.display = 'block';
                        debugInfo.innerHTML = '❌ 顔が検出されていません';
                        
                        if (frameCount % 60 === 0) {
                            console.log('⚠️ 顔が検出されませんでした');
                        }
                    }
                }
                
                // FPS計算
                frameCount++;
                const currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    fpsDisplay.textContent = `${fps} FPS`;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
            } catch (error) {
                console.error('検出エラー:', error);
            }
            
            animationId = requestAnimationFrame(detectPose);
        }
        
        // 姿勢の描画
        function drawPose(pose) {
            const keypoints = pose.keypoints;
            const minConfidence = 0.3;
            
            // キーポイントの描画
            keypoints.forEach(keypoint => {
                if (keypoint.score > minConfidence) {
                    drawKeypoint(keypoint);
                }
            });
            
            // スケルトンの描画
            const adjacentPairs = [
                [0, 1], [0, 2], [1, 3], [2, 4],  // 顔
                [5, 6], [5, 7], [7, 9], [6, 8], [8, 10],  // 腕
                [5, 11], [6, 12], [11, 12],  // 胴体
                [11, 13], [13, 15], [12, 14], [14, 16]  // 脚
            ];
            
            adjacentPairs.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];
                
                if (kp1.score > minConfidence && kp2.score > minConfidence) {
                    drawLine(kp1, kp2);
                }
            });
        }
        
        // キーポイントの描画
        function drawKeypoint(keypoint) {
            ctx.beginPath();
            ctx.arc(keypoint.x, keypoint.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#00ff00';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // 線の描画
        function drawLine(kp1, kp2) {
            ctx.beginPath();
            ctx.moveTo(kp1.x, kp1.y);
            ctx.lineTo(kp2.x, kp2.y);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        // 顔メッシュの描画
        function drawFace(face) {
            // デバッグログ（60フレームごと = 約2秒に1回）
            if (frameCount % 60 === 0) {
                console.log('🎨 drawFace呼び出し:', face);
            }
            
            // バウンディングボックスの描画（box または boundingBox プロパティを確認）
            const box = face.box || face.boundingBox;
            if (box) {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 3;
                
                // box の形式に応じて描画を調整
                if (box.xMin !== undefined && box.yMin !== undefined) {
                    // {xMin, yMin, width, height} 形式
                    const width = box.width || (box.xMax - box.xMin);
                    const height = box.height || (box.yMax - box.yMin);
                    ctx.strokeRect(box.xMin, box.yMin, width, height);
                    
                    // ラベル表示（背景付き）
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                    ctx.fillRect(box.xMin, box.yMin - 25, 100, 25);
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('顔検出 ✓', box.xMin + 5, box.yMin - 8);
                } else if (box.x !== undefined && box.y !== undefined) {
                    // {x, y, width, height} 形式
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                    
                    // ラベル表示（背景付き）
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                    ctx.fillRect(box.x, box.y - 25, 100, 25);
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('顔検出 ✓', box.x + 5, box.y - 8);
                }
            } else {
                // バウンディングボックスがない場合、簡易的な表示
                if (face.keypoints && face.keypoints.length > 0) {
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                    ctx.fillRect(10, 100, 100, 25);
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('顔検出 ✓', 15, 117);
                }
            }
            
            // キーポイント（ランドマーク）の描画
            if (face.keypoints && Array.isArray(face.keypoints)) {
                if (frameCount % 60 === 0) {
                    console.log('✅ キーポイント数:', face.keypoints.length);
                }
                
                // すべてのランドマークを描画（468個）
                let validPointCount = 0;
                face.keypoints.forEach((keypoint, index) => {
                    const x = keypoint.x;
                    const y = keypoint.y;
                    
                    if (x !== undefined && y !== undefined && !isNaN(x) && !isNaN(y)) {
                        validPointCount++;
                        // 小さな点として描画
                        ctx.beginPath();
                        ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#00ff00';
                        ctx.fill();
                    }
                });
                
                if (frameCount % 60 === 0) {
                    console.log('✅ 有効なポイント数:', validPointCount);
                }
                
                // 主要なランドマークを大きく表示
                drawFacialFeatures(face.keypoints);
            } else {
                if (frameCount % 60 === 0) {
                    console.log('❌ キーポイントが見つかりません:', face);
                }
            }
        }
        
        // 主要な顔のパーツを描画（目、鼻、口など）
        function drawFacialFeatures(keypoints) {
            if (frameCount % 60 === 0) {
                console.log('🎈 drawFacialFeatures 呼び出し, keypoints数:', keypoints.length);
            }
            
            if (!keypoints || keypoints.length === 0) {
                if (frameCount % 60 === 0) {
                    console.warn('⚠️ keypointsが空です');
                }
                return;
            }
            
            // 顔の主要な特徴点のインデックス（MediaPipe FaceMesh仕様）
            const features = {
                leftEye: [33, 133, 157, 158, 159, 160, 161, 163, 144, 145, 153, 154, 155],
                rightEye: [362, 263, 387, 386, 385, 384, 398, 373, 374, 380, 381, 382],
                leftEyebrow: [70, 63, 105, 66, 107, 55, 65, 52, 53, 46],
                rightEyebrow: [300, 293, 334, 296, 336, 285, 295, 282, 283, 276],
                nose: [1, 2, 98, 327],
                lips: [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 185, 40, 39, 37, 0, 267, 269, 270, 409],
                faceOval: [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
            };
            
            // 左目の輪郭
            drawFeaturePath(keypoints, features.leftEye, '#00ffff', true);
            
            // 右目の輪郭
            drawFeaturePath(keypoints, features.rightEye, '#00ffff', true);
            
            // 左眉毛
            drawFeaturePath(keypoints, features.leftEyebrow, '#ffff00', false);
            
            // 右眉毛
            drawFeaturePath(keypoints, features.rightEyebrow, '#ffff00', false);
            
            // 鼻
            drawFeaturePath(keypoints, features.nose, '#ff00ff', false);
            
            // 唇の輪郭
            drawFeaturePath(keypoints, features.lips, '#ff0000', true);
            
            // 顔の輪郭
            drawFeaturePath(keypoints, features.faceOval, '#00ff00', false);
            
            if (frameCount % 60 === 0) {
                console.log('✅ drawFacialFeatures 完了');
            }
        }
        
        // 特徴点を線で結ぶ
        function drawFeaturePath(keypoints, indices, color, closed) {
            if (indices.length < 2) return;
            
            try {
                ctx.beginPath();
                const firstPoint = keypoints[indices[0]];
                if (!firstPoint || firstPoint.x === undefined || firstPoint.y === undefined) {
                    console.warn('無効な最初のポイント:', indices[0]);
                    return;
                }
                ctx.moveTo(firstPoint.x, firstPoint.y);
                
                for (let i = 1; i < indices.length; i++) {
                    const point = keypoints[indices[i]];
                    if (point && point.x !== undefined && point.y !== undefined) {
                        ctx.lineTo(point.x, point.y);
                    }
                }
                
                if (closed) {
                    ctx.closePath();
                }
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 各ポイントに円を描画
                indices.forEach(index => {
                    const point = keypoints[index];
                    if (point && point.x !== undefined && point.y !== undefined) {
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, 3, 0, 2 * Math.PI);
                        ctx.fillStyle = color;
                        ctx.fill();
                    }
                });
            } catch (error) {
                console.error('drawFeaturePath エラー:', error);
            }
        }
        
        // イベントリスナー
        startBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera();
            }
        });
        
        switchBtn.addEventListener('click', switchCamera);
        
        modelSwitchBtn.addEventListener('click', switchDetectionMode);
        
        // ページ読み込み時に初期化
        window.addEventListener('load', init);
        
        // ページを離れる時にカメラを停止
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
