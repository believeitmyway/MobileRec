<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>姿勢検出デモ - Pose Detection Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #container {
            position: relative;
            max-width: 100vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* ミラー表示 */
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* ミラー表示 */
        }
        
        #controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status {
            color: white;
            font-size: 14px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            text-align: center;
            max-width: 90vw;
        }
        
        #fps {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
        
        .loading {
            color: white;
            font-size: 18px;
            text-align: center;
        }
        
        .error {
            color: #ff6b6b;
            background: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 90vw;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status" class="loading">モデルを読み込み中...</div>
        
        <div id="video-container" style="display: none;">
            <div id="fps">0 FPS</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="controls">
            <button id="startBtn" disabled>カメラを起動</button>
            <button id="switchBtn" style="display: none;">カメラ切替</button>
        </div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <!-- Pose Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0"></script>

    <script>
        let video, canvas, ctx;
        let detector;
        let animationId;
        let currentFacingMode = 'user'; // 'user' = フロントカメラ, 'environment' = バックカメラ
        let stream;
        
        // FPS計測用
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        
        // UI要素
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const videoContainer = document.getElementById('video-container');
        const fpsDisplay = document.getElementById('fps');
        
        // 初期化
        async function init() {
            try {
                video = document.getElementById('video');
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                
                // モデルの読み込み
                statusDiv.textContent = 'モデルを読み込み中...';
                
                // MoveNet Lightning（軽量版）を使用
                detector = await poseDetection.createDetector(
                    poseDetection.SupportedModels.MoveNet,
                    {
                        modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                    }
                );
                
                statusDiv.textContent = 'モデルの読み込み完了！カメラを起動してください';
                startBtn.disabled = false;
                
            } catch (error) {
                console.error('初期化エラー:', error);
                statusDiv.className = 'error';
                statusDiv.textContent = '初期化に失敗しました: ' + error.message;
            }
        }
        
        // カメラ起動
        async function startCamera() {
            try {
                // 既存のストリームを停止
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                statusDiv.textContent = 'カメラを起動中...';
                
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    // キャンバスのサイズを動画に合わせる
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    videoContainer.style.display = 'block';
                    statusDiv.style.display = 'none';
                    switchBtn.style.display = 'inline-block';
                    startBtn.textContent = 'カメラを停止';
                    
                    // 検出開始
                    detectPose();
                };
                
            } catch (error) {
                console.error('カメラエラー:', error);
                statusDiv.className = 'error';
                statusDiv.textContent = 'カメラの起動に失敗しました: ' + error.message;
            }
        }
        
        // カメラ停止
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            videoContainer.style.display = 'none';
            statusDiv.style.display = 'block';
            statusDiv.className = '';
            statusDiv.textContent = 'カメラを起動してください';
            switchBtn.style.display = 'none';
            startBtn.textContent = 'カメラを起動';
        }
        
        // カメラ切替
        async function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            await startCamera();
        }
        
        // 姿勢検出
        async function detectPose() {
            if (!video || video.readyState < 2) {
                animationId = requestAnimationFrame(detectPose);
                return;
            }
            
            try {
                // 姿勢を検出
                const poses = await detector.estimatePoses(video);
                
                // キャンバスをクリア
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 検出された姿勢を描画
                if (poses && poses.length > 0) {
                    drawPose(poses[0]);
                }
                
                // FPS計算
                frameCount++;
                const currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    fpsDisplay.textContent = `${fps} FPS`;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
            } catch (error) {
                console.error('検出エラー:', error);
            }
            
            animationId = requestAnimationFrame(detectPose);
        }
        
        // 姿勢の描画
        function drawPose(pose) {
            const keypoints = pose.keypoints;
            const minConfidence = 0.3;
            
            // キーポイントの描画
            keypoints.forEach(keypoint => {
                if (keypoint.score > minConfidence) {
                    drawKeypoint(keypoint);
                }
            });
            
            // スケルトンの描画
            const adjacentPairs = [
                [0, 1], [0, 2], [1, 3], [2, 4],  // 顔
                [5, 6], [5, 7], [7, 9], [6, 8], [8, 10],  // 腕
                [5, 11], [6, 12], [11, 12],  // 胴体
                [11, 13], [13, 15], [12, 14], [14, 16]  // 脚
            ];
            
            adjacentPairs.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];
                
                if (kp1.score > minConfidence && kp2.score > minConfidence) {
                    drawLine(kp1, kp2);
                }
            });
        }
        
        // キーポイントの描画
        function drawKeypoint(keypoint) {
            ctx.beginPath();
            ctx.arc(keypoint.x, keypoint.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#00ff00';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // 線の描画
        function drawLine(kp1, kp2) {
            ctx.beginPath();
            ctx.moveTo(kp1.x, kp1.y);
            ctx.lineTo(kp2.x, kp2.y);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        // イベントリスナー
        startBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera();
            }
        });
        
        switchBtn.addEventListener('click', switchCamera);
        
        // ページ読み込み時に初期化
        window.addEventListener('load', init);
        
        // ページを離れる時にカメラを停止
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
